<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Retail Club AI · Поездка 19–27.09</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --text:#1b1c1e; --muted:#6f7278; --line:#e4e1d9;
    --accent:#0f5f6e; --accent-soft:#dfeef0; --accent-text:#0f5f6e;
    --note:#fff7dc; --danger:#b3261e; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17191c; --card:#22252a; --text:#ecebe6; --muted:#9a9ea6; --line:#31353b;
      --accent:#4fb3c3; --accent-soft:#1b3b41; --accent-text:#7fd0dc; --note:#3a3420;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17191c; --card:#22252a; --text:#ecebe6; --muted:#9a9ea6; --line:#31353b;
    --accent:#4fb3c3; --accent-soft:#1b3b41; --accent-text:#7fd0dc; --note:#3a3420;
  }
  /* Telegram theme overrides when running inside Telegram */
  body.in-tg{
    --bg:var(--tg-theme-secondary-bg-color,var(--bg));
    --card:var(--tg-theme-bg-color,var(--card));
    --text:var(--tg-theme-text-color,var(--text));
    --muted:var(--tg-theme-hint-color,var(--muted));
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }
  button{font:inherit; color:inherit}
  .app{max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column}

  header{padding:14px 16px 8px}
  header h1{font-size:19px; font-weight:700; margin:0; letter-spacing:-.01em}
  header p{margin:2px 0 0; color:var(--muted); font-size:13px}

  .tabs{display:flex; gap:6px; padding:0 16px 10px; overflow-x:auto; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto; border:1px solid var(--line); background:var(--card); border-radius:12px;
       padding:6px 10px; text-align:center; line-height:1.15; min-width:58px; cursor:pointer}
  .day small{display:block; font-size:11px; color:var(--muted)}
  .day b{font-size:16px; font-weight:600}
  .day.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .day.active small{color:rgba(255,255,255,.8)}
  .day .dot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--accent); margin-left:3px; vertical-align:middle}
  .day.active .dot{background:#fff}

  main{flex:1; padding:0 16px 96px}
  .daytitle{color:var(--muted); font-size:13px; margin:6px 0 10px}

  .item{display:grid; grid-template-columns:64px 1fr; gap:10px; background:var(--card);
        border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:8px; cursor:pointer}
  .item:active{background:var(--accent-soft)}
  .time{font-size:13px; color:var(--muted); line-height:1.3; padding-top:2px; word-break:break-word}
  .item .place{font-weight:600; font-size:15px}
  .item .goal{color:var(--muted); font-size:13px; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .item .meta{margin-top:6px; display:flex; gap:6px; flex-wrap:wrap}
  .tag{font-size:11px; padding:2px 7px; border-radius:6px; background:var(--accent-soft); color:var(--accent-text)}
  .tag.n{background:var(--note); color:var(--text)}
  .tag.opt{background:transparent; border:1px dashed var(--line); color:var(--muted)}
  .kind-flight .time::before{content:"✈ "}
  .kind-hotel .time::before{content:"🛏 "}

  .bottom{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line);
          padding:8px 16px calc(8px + env(safe-area-inset-bottom)); display:flex; justify-content:center; gap:8px}
  .bottom button{flex:1; max-width:300px; border:0; background:transparent; padding:8px; border-radius:10px; color:var(--muted)}
  .bottom button.on{color:var(--accent-text); background:var(--accent-soft); font-weight:600}

  /* detail sheet */
  .sheet{position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10}
  .sheet.open{display:flex}
  .sheet .top{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card)}
  .sheet .top button{border:0; background:transparent; font-size:15px; color:var(--accent-text); padding:4px 0}
  .sheet .body{flex:1; overflow:auto; padding:16px; max-width:640px; width:100%; margin:0 auto}
  .sheet h2{font-size:20px; margin:0 0 4px; letter-spacing:-.01em}
  .sheet .sub{color:var(--muted); font-size:14px; margin:0 0 14px}
  .sheet .goal{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px; font-size:15px; white-space:pre-wrap}
  h3{font-size:14px; color:var(--muted); font-weight:600; margin:22px 0 8px}
  .note{background:var(--note); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px; white-space:pre-wrap; font-size:15px}
  .note .when{font-size:11px; color:var(--muted); margin-top:6px; display:flex; justify-content:space-between; align-items:center}
  .note .when span{display:flex; gap:12px}
  .note .when button{border:0; background:transparent; color:var(--accent-text); padding:0; font-size:12px}
  .note .when button.del{color:var(--danger)}
  .empty{color:var(--muted); font-size:14px; padding:8px 0}
  textarea{width:100%; min-height:88px; border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px;
           background:var(--card); color:var(--text); font:inherit; resize:vertical}
  textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
  .row{display:flex; gap:8px; margin-top:8px}
  .btn{border:0; border-radius:12px; padding:11px 16px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer}
  .btn.ghost{background:var(--card); color:var(--accent-text); border:1px solid var(--line)}
  .btn:disabled{opacity:.45}

  /* notes overview */
  .group{margin-bottom:18px}
  .group .g-title{font-weight:600; font-size:15px}
  .group .g-sub{font-size:12px; color:var(--muted); margin-bottom:6px}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 16px}
  .actions .btn{padding:10px 8px; font-size:14px}
  .toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:var(--text); color:var(--bg);
         padding:8px 14px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20}
  .toast.show{opacity:1}
  pre.export{white-space:pre-wrap; font:13px/1.45 ui-monospace,Menlo,monospace; background:var(--card); border:1px solid var(--line);
             border-radius:var(--radius); padding:12px; user-select:all; -webkit-user-select:all}
  /* photos */
  .thumbs{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
  .thumbs .th{position:relative; width:72px; height:72px; border-radius:10px; overflow:hidden; background:var(--line); cursor:pointer}
  .thumbs .th img{width:100%; height:100%; object-fit:cover; display:block}
  .thumbs .th .rm{position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:50%; border:0;
                  background:rgba(0,0,0,.6); color:#fff; font-size:14px; line-height:22px; padding:0}
  .viewer{position:fixed; inset:0; background:rgba(0,0,0,.94); display:none; align-items:center; justify-content:center; z-index:30}
  .viewer.open{display:flex}
  .viewer img{max-width:100%; max-height:100%; object-fit:contain}
  .viewer button{position:absolute; top:14px; right:14px; border:0; background:rgba(255,255,255,.15); color:#fff; border-radius:50%; width:36px; height:36px; font-size:20px}
  .hint{font-size:12px; color:var(--muted); margin-top:6px}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Retail Club AI · Калифорния</h1>
    <p>19–27 сентября 2026 · Ташкент → Нью-Йорк → Лос-Анджелес</p>
  </header>

  <div id="view-schedule">
    <div class="tabs" id="tabs"></div>
    <main id="list"></main>
  </div>

  <div id="view-notes" style="display:none">
    <main id="notes"></main>
  </div>

  <div class="bottom">
    <button id="nav-schedule" class="on">График</button>
    <button id="nav-notes">Заметки</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="top"><button id="back">‹ Назад</button></div>
  <div class="body" id="sheet-body"></div>
</div>
<div class="viewer" id="viewer"><button id="viewer-close" aria-label="Закрыть">×</button><img id="viewer-img" alt=""></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" multiple hidden>
<div class="toast" id="toast"></div>

<script>
/* ---------- данные поездки ---------- */
const DAYS = [
  {d:'2026-09-19', wd:'Сб', label:'19 сен', title:'Суббота, 19 сентября · перелёт'},
  {d:'2026-09-20', wd:'Вс', label:'20 сен', title:'Воскресенье, 20 сентября · Нью-Йорк'},
  {d:'2026-09-21', wd:'Пн', label:'21 сен', title:'Понедельник, 21 сентября · перелёт в LA'},
  {d:'2026-09-22', wd:'Вт', label:'22 сен', title:'Вторник, 22 сентября · фестиваль, день 1'},
  {d:'2026-09-23', wd:'Ср', label:'23 сен', title:'Среда, 23 сентября · фестиваль + Retail Safari'},
  {d:'2026-09-24', wd:'Чт', label:'24 сен', title:'Четверг, 24 сентября · AI-сессии + Retail Safari 2'},
  {d:'2026-09-25', wd:'Пт', label:'25 сен', title:'Пятница, 25 сентября · перелёт в Нью-Йорк'},
  {d:'2026-09-26', wd:'Сб', label:'26 сен', title:'Суббота, 26 сентября · обратный вылет'},
  {d:'2026-09-27', wd:'Вс', label:'27 сен', title:'Воскресенье, 27 сентября · прилёт'},
];

const ACTS = [
 {id:'a01', d:'2026-09-19', t:'06:45–10:55', k:'flight', p:'Ташкент → Нью-Йорк', g:'Перелёт в Нью-Йорк'},
 {id:'a02', d:'2026-09-19', t:'16:00', k:'hotel', p:'Martinique New York on Broadway', g:'Check-in'},
 {id:'a03', d:'2026-09-20', t:'В течение дня', k:'free', p:'Нью-Йорк / Manhattan', g:'Свободная программа'},
 {id:'a04', d:'2026-09-21', t:'10:00–13:00', k:'flight', p:'Нью-Йорк → Los Angeles', g:'Перелёт в Лос-Анджелес'},
 {id:'a05', d:'2026-09-21', t:'15:00', k:'hotel', p:'Holiday Inn Express & Suites Santa Ana – Orange County', g:'Check-in / подготовка к Retail Club AI Festival'},
 {id:'a06', d:'2026-09-21', t:'16:00–22:00', k:'store', opt:true, p:'Walmart', g:'Осмотр магазина (опционально)'},
 {id:'a07', d:'2026-09-22', t:'14:00–17:35', k:'event', p:'Retail Club AI Festival', g:'Основная программа AI Festival: ключевые сессии и выступления'},
 {id:'a08', d:'2026-09-22', t:'17:30–19:00', k:'event', p:'PCH Food Pavilion', g:'Welcome Beachside Bash'},
 {id:'a09', d:'2026-09-23', t:'09:25–13:05', k:'event', p:'Retail Club AI Festival', g:'Ключевые AI-сессии, networking и выставочная зона'},
 {id:'a10', d:'2026-09-23', t:'13:30–19:10', k:'store', p:'Retail Safari', g:'Micro Center – Tustin · Samsung Experience Store – Los Cerritos Center · Apple Tower Theatre · Ross Dress for Less · IKEA Culver City · The Home Depot · Target · Google Store'},
 {id:'a11', d:'2026-09-24', t:'09:25–09:45', k:'event', p:'Retail Club AI', g:'The New Retail UX: Conversational, Multimodal & Agent-Enabled (Ocean Stage)\nThe AI-Powered Store Associate (PCH)\nThe Future of Physical AI in Retail (AI Current)'},
 {id:'a12', d:'2026-09-24', t:'09:45–10:05', k:'event', p:'Retail Club AI', g:'The AI-First Marketing Organization (Ocean Stage)\nFrom Design to Production: Using AI to Create Elevated Products (PCH)\nWhich AI Tool for Which Task? Choosing the Right Models and Tools (AI Current)'},
 {id:'a13', d:'2026-09-24', t:'10:05–10:25', k:'event', p:'Retail Club AI', g:'The New AI Operating Model (Ocean Stage)\nBrand Building in an AI Era: Trust, Loyalty & Differentiation (PCH)\nHow AI is Improving the Post-Purchase Experience (AI Current)'},
 {id:'a14', d:'2026-09-24', t:'12:30–13:05', k:'event', p:'Retail Club AI', g:'When Chat Becomes the Channel: Advertising in the Age of AI Assistants (AI Sandbox)\nDeciding Where Humans Belong in AI Workflows (AI Current)\nHow We Became an AI-First Organization (Level Up)'},
 {id:'a15', d:'2026-09-24', t:'13:30–14:15', k:'store', p:'Bed Bath & Beyond + The Container Store — Costa Mesa', g:'Home transformation: co-branded platform, organization, custom spaces, design/installation.'},
 {id:'a16', d:'2026-09-24', t:'14:30–15:15', k:'store', p:'Curacao Santa Ana — Fountain Valley', g:'Retail + embedded/proprietary finance: electronics/home/appliances + customer segmentation.'},
 {id:'a17', d:'2026-09-24', t:'15:30–16:15', k:'store', p:'Costco Wholesale — Huntington Beach', g:'Membership warehouse economics: limited assortment, bulk packs, Kirkland, membership + turns.'},
 {id:'a18', d:'2026-09-24', t:'16:25–17:10', k:'store', p:'HomeGoods — Huntington Beach', g:'Off-price Home / treasure hunt: opportunistic buying, store-only discovery, rapid rotation.'},
 {id:'a19', d:'2026-09-24', t:'17:20–18:05', k:'store', p:'World Market — Huntington Beach / Bella Terra', g:'Discovery retail: global curation, home/furniture + food/gifts + seasonal merchandising.'},
 {id:'a20', d:'2026-09-24', t:'18:20–19:05', k:'store', p:'Best Buy Costa Mesa + Meta Lab', g:'Multibrand platform + Meta Lab + vendor shop-in-shop + services.'},
 {id:'a21', d:'2026-09-25', t:'08:00–16:30', k:'flight', p:'Los Angeles (LAX) → New York (JFK)', g:'Перелёт в Нью-Йорк'},
 {id:'a22', d:'2026-09-25', t:'17:30', k:'hotel', p:'Hilton Club The Central at 5th New York', g:'Check-in / отдых перед обратным вылетом'},
 {id:'a23', d:'2026-09-25', t:'18:00–22:00', k:'store', opt:true, p:'Walmart', g:'Осмотр магазина (опционально)'},
 {id:'a24', d:'2026-09-26', t:'12:55', k:'flight', p:'JFK Terminal 4', g:'Вылет HY102 → Ташкент'},
 {id:'a25', d:'2026-09-27', t:'09:55', k:'flight', p:'Tashkent International, Terminal 2', g:'Прилёт в Ташкент'},
];
const GENERAL = {id:'g00', d:'', t:'', k:'general', p:'Общие заметки', g:'Идеи и наблюдения, не привязанные к конкретному пункту программы'};
const KIND = {flight:'Перелёт', hotel:'Отель', free:'Свободно', event:'Фестиваль', store:'Магазин', general:'Общее'};

/* ---------- хранилище: Telegram CloudStorage → localStorage ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
const cloud = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
const KEYS = [...ACTS, GENERAL].map(a => 'n_' + a.id);
let notes = {}; // id -> [{t, x}]

function loadAll(){
  return new Promise(res => {
    if (cloud){
      cloud.getItems(KEYS, (err, vals) => {
        if (!err && vals){ for (const k in vals){ try{ notes[k.slice(2)] = JSON.parse(vals[k] || '[]'); }catch{} } }
        res();
      });
    } else {
      for (const k of KEYS){ try{ const v = localStorage.getItem(k); if (v) notes[k.slice(2)] = JSON.parse(v); }catch{} }
      res();
    }
  });
}
function save(id){
  const val = JSON.stringify(notes[id] || []);
  if (cloud){ cloud.setItem('n_' + id, val, (err) => { if (err) toast('Не удалось сохранить в Telegram'); }); }
  try{ localStorage.setItem('n_' + id, val); }catch{}
}

/* ---------- фото: IndexedDB на устройстве ---------- */
const PH = (() => {
  let db = null, mem = {};
  const open = () => new Promise(res => {
    if (db) return res(db);
    if (!window.indexedDB) return res(null);
    const r = indexedDB.open('trip-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => res(null);
  });
  const tx = async (mode, fn) => {
    const d = await open();
    if (!d) return fn(null);
    return new Promise(res => { const t = d.transaction('p', mode); const req = fn(t.objectStore('p')); req.onsuccess = () => res(req.result); req.onerror = () => res(undefined); });
  };
  return {
    async put(id, data){ const d = await open(); if (!d){ mem[id] = data; return; } try{ await tx('readwrite', s => s.put(data, id)); }catch{ mem[id] = data; } },
    async get(id){ try{ const v = await tx('readonly', s => s ? s.get(id) : null); return v || mem[id] || null; }catch{ return mem[id] || null; } },
    async del(id){ try{ await tx('readwrite', s => s ? s.delete(id) : null); }catch{} delete mem[id]; }
  };
})();
function compress(file, max = 1280, q = 0.72){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
const photoCache = {};
async function photoSrc(id){ if (!photoCache[id]) photoCache[id] = await PH.get(id); return photoCache[id]; }
async function thumbsHtml(ids, removable){
  if (!ids || !ids.length) return '';
  const parts = [];
  for (const id of ids){
    const src = await photoSrc(id);
    parts.push(`<div class="th" data-view="${id}">${src ? `<img src="${src}" alt="">` : ''}${removable ? `<button class="rm" data-rm="${id}" aria-label="Убрать">×</button>` : ''}</div>`);
  }
  return `<div class="thumbs">${parts.join('')}</div>`;
}
function bindThumbs(root){
  root.querySelectorAll('[data-view]').forEach(el => el.onclick = async e => {
    if (e.target.dataset.rm) return;
    const src = await photoSrc(el.dataset.view); if (!src) return;
    $('#viewer-img').src = src; $('#viewer').classList.add('open');
  });
}
let pending = []; // фото, добавленные до сохранения заметки

/* ---------- UI ---------- */
const $ = s => document.querySelector(s);
let curDay = DAYS[0].d;
let curAct = null;
let editIdx = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function count(id){ return (notes[id] || []).length; }
function fmt(ts){ const d = new Date(ts); return d.toLocaleString('ru-RU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1600); }

function renderTabs(){
  $('#tabs').innerHTML = DAYS.map(x => {
    const has = ACTS.some(a => a.d === x.d && count(a.id));
    return `<div class="day ${x.d===curDay?'active':''}" data-d="${x.d}"><small>${x.wd}</small><b>${x.label.split(' ')[0]}</b>${has?'<span class="dot"></span>':''}</div>`;
  }).join('');
  $('#tabs').querySelectorAll('.day').forEach(el => el.onclick = () => { curDay = el.dataset.d; renderTabs(); renderList(); });
}
function renderList(){
  const day = DAYS.find(x => x.d === curDay);
  const items = ACTS.filter(a => a.d === curDay);
  $('#list').innerHTML = `<div class="daytitle">${day.title}</div>` + items.map(a => `
    <div class="item kind-${a.k}" data-id="${a.id}">
      <div class="time">${esc(a.t)}</div>
      <div>
        <div class="place">${esc(a.p)}</div>
        <div class="goal">${esc(a.g)}</div>
        <div class="meta"><span class="tag">${KIND[a.k]}</span>${a.opt?'<span class="tag opt">опционально</span>':''}${count(a.id)?`<span class="tag n">заметок: ${count(a.id)}</span>`:''}</div>
      </div>
    </div>`).join('');
  $('#list').querySelectorAll('.item').forEach(el => el.onclick = () => openAct(el.dataset.id));
}

function openAct(id){
  curAct = id; editIdx = null;
  renderSheet();
  $('#sheet').classList.add('open');
  if (tg){ tg.BackButton.show(); }
}
function closeSheet(){
  $('#sheet').classList.remove('open');
  curAct = null; editIdx = null; pending = [];
  if (tg){ tg.BackButton.hide(); }
  renderTabs(); renderList(); renderNotes();
}
async function renderSheet(){
  const a = curAct === 'g00' ? GENERAL : ACTS.find(x => x.id === curAct);
  const day = DAYS.find(x => x.d === a.d);
  const list = notes[a.id] || [];
  const noteBlocks = [];
  for (let i = 0; i < list.length; i++){
    const n = list[i];
    noteBlocks.push(`<div class="note">${esc(n.x)}${await thumbsHtml(n.ph)}
      <div class="when">${fmt(n.t)}<span><button data-e="${i}">изменить</button><button class="del" data-x="${i}">удалить</button></span></div>
    </div>`);
  }
  const editing = editIdx !== null ? list[editIdx] : null;
  const draftPhotos = editing ? [...(editing.ph || []), ...pending] : pending;
  $('#sheet-body').innerHTML = `
    <h2>${esc(a.p)}</h2>
    <p class="sub">${day ? esc(day.title.split(' · ')[0]) + ' · ' : ''}${esc(a.t)}${a.t?' · ':''}${KIND[a.k]}</p>
    <div class="goal">${esc(a.g)}</div>
    <h3>Мои заметки${list.length?` (${list.length})`:''}</h3>
    ${list.length ? noteBlocks.join('') : '<div class="empty">Пока нет заметок. Запиши наблюдение — что увидел, что можно применить у нас.</div>'}
    <h3>${editing ? 'Изменить заметку' : 'Новая заметка'}</h3>
    <textarea id="ta" placeholder="Например: видел электронные ценники на всей площади — можно пилотировать в 3–5 магазинах">${editing ? esc(editing.x) : ''}</textarea>
    <div class="row">
      <button class="btn ghost" id="shoot">📷 Снять</button>
      <button class="btn ghost" id="pick">🖼 Из галереи</button>
    </div>
    <div id="draftThumbs">${await thumbsHtml(draftPhotos, true)}</div>
    <div class="row">
      <button class="btn" id="saveNote">${editing ? 'Сохранить изменения' : 'Сохранить заметку'}</button>
      ${editing ? '<button class="btn ghost" id="cancelEdit">Отмена</button>' : ''}
    </div>
    <div class="hint">Фото хранятся на этом телефоне; текст заметок — в Telegram.</div>`;
  bindThumbs($('#sheet-body'));
  $('#shoot').onclick = () => $('#cam').click();
  $('#pick').onclick = () => $('#gal').click();
  renderDraft();
  $('#saveNote').onclick = () => {
    const x = $('#ta').value.trim();
    if (!x && !draftPhotos.length){ toast('Заметка пустая'); return; }
    notes[a.id] = notes[a.id] || [];
    if (editing){ editing.x = x || '(фото)'; editing.ph = [...(editing.ph || []), ...pending]; }
    else notes[a.id].push({t: Date.now(), x: x || '(фото)', ph: [...pending]});
    pending = [];
    save(a.id); editIdx = null; renderSheet(); toast('Сохранено');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  };
  const c = $('#cancelEdit'); if (c) c.onclick = () => { editIdx = null; pending = []; renderSheet(); };
  $('#sheet-body').querySelectorAll('[data-e]').forEach(b => b.onclick = async () => { editIdx = +b.dataset.e; pending = []; await renderSheet(); $('#ta').focus(); });
  $('#sheet-body').querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
    const i = +b.dataset.x;
    const go = async () => { for (const id of (notes[a.id][i].ph || [])) await PH.del(id); notes[a.id].splice(i, 1); save(a.id); editIdx = null; renderSheet(); toast('Удалено'); };
    if (tg && tg.showConfirm) tg.showConfirm('Удалить заметку?', ok => ok && go());
    else if (confirm('Удалить заметку?')) go();
  });
}
async function addFiles(files){
  if (!files || !files.length) return;
  toast('Обрабатываю фото…');
  for (const f of files){
    try{
      const data = await compress(f);
      const id = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
      await PH.put(id, data); photoCache[id] = data; pending.push(id);
    }catch{ toast('Не удалось открыть фото'); }
  }
  await renderDraft();
  toast(files.length > 1 ? `Добавлено фото: ${files.length}` : 'Фото добавлено');
}
async function renderDraft(){
  const editing = editIdx !== null ? (notes[curAct] || [])[editIdx] : null;
  $('#draftThumbs').innerHTML = await thumbsHtml(editing ? [...(editing.ph || []), ...pending] : pending, true);
  bindThumbs($('#draftThumbs'));
  $('#draftThumbs').querySelectorAll('[data-rm]').forEach(b => b.onclick = async e => {
    e.stopPropagation(); const id = b.dataset.rm;
    pending = pending.filter(x => x !== id);
    if (editing && editing.ph) editing.ph = editing.ph.filter(x => x !== id);
    await PH.del(id); delete photoCache[id]; renderDraft();
  });
}
$('#cam').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
$('#gal').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
$('#viewer-close').onclick = () => $('#viewer').classList.remove('open');
$('#viewer').onclick = e => { if (e.target === $('#viewer')) $('#viewer').classList.remove('open'); };

function photoCount(){ return KEYS.reduce((s, k) => s + (notes[k.slice(2)] || []).reduce((t, n) => t + (n.ph || []).length, 0), 0); }
function allNotesText(){
  const lines = ['Retail Club AI Festival — заметки из поездки, 19–27.09.2026', ''];
  const line = n => '   – ' + n.x.replace(/\n/g, '\n     ') + ((n.ph || []).length ? ` [фото: ${n.ph.length}]` : '');
  for (const d of DAYS){
    const acts = ACTS.filter(a => a.d === d.d && count(a.id));
    if (!acts.length) continue;
    lines.push('== ' + d.title + ' ==');
    for (const a of acts){ lines.push(`• ${a.t} — ${a.p}`); for (const n of notes[a.id]) lines.push(line(n)); }
    lines.push('');
  }
  if (count('g00')){ lines.push('== Общие заметки =='); for (const n of notes.g00) lines.push(line(n)); }
  return lines.join('\n').trim();
}
async function buildReportHtml(){
  let body = '';
  const block = async n => {
    let ph = '';
    for (const id of (n.ph || [])){ const src = await photoSrc(id); if (src) ph += `<img src="${src}">`; }
    return `<div class="n"><p>${esc(n.x).replace(/\n/g,'<br>')}</p>${ph ? `<div class="ph">${ph}</div>` : ''}<small>${fmt(n.t)}</small></div>`;
  };
  for (const d of DAYS){
    const acts = ACTS.filter(a => a.d === d.d && count(a.id));
    if (!acts.length) continue;
    body += `<h2>${esc(d.title)}</h2>`;
    for (const a of acts){ body += `<h3>${esc(a.t)} — ${esc(a.p)}</h3>`; for (const n of notes[a.id]) body += await block(n); }
  }
  if (count('g00')){ body += '<h2>Общие заметки</h2>'; for (const n of notes.g00) body += await block(n); }
  return `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Заметки — Retail Club AI 2026</title>
<style>body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#1b1c1e}
h1{font-size:22px}h2{font-size:18px;margin:28px 0 8px;border-bottom:1px solid #ddd;padding-bottom:4px}h3{font-size:15px;margin:16px 0 6px;color:#0f5f6e}
.n{background:#fff7dc;border-radius:10px;padding:10px 12px;margin:0 0 8px}.n p{margin:0 0 6px}.n small{color:#777}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.ph img{width:180px;height:180px;object-fit:cover;border-radius:8px}
@media print{.ph img{width:150px;height:150px}}</style></head><body><h1>Retail Club AI Festival — заметки из поездки, 19–27.09.2026</h1>${body}</body></html>`;
}
async function exportReport(){
  toast('Собираю отчёт…');
  const html = await buildReportHtml();
  const blob = new Blob([html], {type:'text/html'});
  const file = new File([blob], 'retail-trip-notes.html', {type:'text/html'});
  if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Заметки из поездки'}); return; }catch(e){ if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'retail-trip-notes.html'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Файл отправлен на скачивание');
}
async function renderNotes(){
  const total = KEYS.reduce((s, k) => s + count(k.slice(2)), 0);
  const pc = photoCount();
  let html = `<div class="daytitle">Всего заметок: ${total}${pc ? ` · фото: ${pc}` : ''}</div>
    <div class="actions">
      <button class="btn" id="copyAll" ${total?'':'disabled'}>Скопировать текст</button>
      <button class="btn ghost" id="showText" ${total?'':'disabled'}>Показать текстом</button>
      <button class="btn ghost" id="exportHtml" ${total?'':'disabled'}>Отчёт с фото (файл)</button>
      <button class="btn ghost" id="addGeneral">+ Общая заметка</button>
    </div><div id="exportBox"></div>`;
  const noteHtml = async (n, id) => `<div class="note" data-open="${id}">${esc(n.x)}${await thumbsHtml(n.ph)}<div class="when">${fmt(n.t)}</div></div>`;
  for (const d of DAYS){
    const acts = ACTS.filter(a => a.d === d.d && count(a.id));
    if (!acts.length) continue;
    html += `<div class="daytitle">${d.title}</div>`;
    for (const a of acts){
      html += `<div class="group"><div class="g-title">${esc(a.p)}</div><div class="g-sub">${esc(a.t)}</div>`;
      for (const n of notes[a.id]) html += await noteHtml(n, a.id);
      html += '</div>';
    }
  }
  if (count('g00')){
    html += `<div class="daytitle">Общие заметки</div><div class="group">`;
    for (const n of notes.g00) html += await noteHtml(n, 'g00');
    html += '</div>';
  }
  if (!total) html += '<div class="empty">Заметки появятся здесь по мере поездки. Открой любой пункт графика и запиши наблюдение.</div>';
  $('#notes').innerHTML = html;
  $('#notes').querySelectorAll('[data-open]').forEach(el => el.onclick = e => { if (e.target.closest('[data-view]')) return; openAct(el.dataset.open); });
  bindThumbs($('#notes'));
  $('#addGeneral').onclick = () => openAct('g00');
  $('#exportHtml').onclick = exportReport;
  $('#copyAll').onclick = async () => {
    const text = allNotesText();
    try{ await navigator.clipboard.writeText(text); toast('Скопировано'); }
    catch{ $('#exportBox').innerHTML = `<pre class="export">${esc(text)}</pre>`; toast('Выдели текст и скопируй'); }
  };
  $('#showText').onclick = () => {
    const box = $('#exportBox');
    box.innerHTML = box.innerHTML ? '' : `<pre class="export">${esc(allNotesText())}</pre>`;
  };
}

function showView(v){
  $('#view-schedule').style.display = v === 'schedule' ? '' : 'none';
  $('#view-notes').style.display = v === 'notes' ? '' : 'none';
  $('#nav-schedule').classList.toggle('on', v === 'schedule');
  $('#nav-notes').classList.toggle('on', v === 'notes');
  if (v === 'notes') renderNotes(); else { renderTabs(); renderList(); }
  window.scrollTo(0, 0);
}
$('#nav-schedule').onclick = () => showView('schedule');
$('#nav-notes').onclick = () => showView('notes');
$('#back').onclick = closeSheet;

/* ---------- запуск ---------- */
(async () => {
  if (tg){
    document.body.classList.add('in-tg');
    tg.ready(); tg.expand();
    if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;
    tg.onEvent('themeChanged', () => { document.documentElement.dataset.theme = tg.colorScheme; });
    tg.BackButton.onClick(closeSheet);
  }
  await loadAll();
  // открыть текущий день поездки, если он идёт
  const today = new Date().toISOString().slice(0, 10);
  if (DAYS.some(x => x.d === today)) curDay = today;
  showView('schedule');
})();
</script>
